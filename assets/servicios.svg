  <text x="42" y="270" class="s" font-size="16" font-weight="400" fill="#8b949e">Ejemplos: Templvm, PitLane, MatchPoint</text>
  <rect x="438" y="44" width="44" height="5" rx="2.5" fill="#ffb547"/>
  <text x="438" y="98" class="s" font-size="27" font-weight="700" fill="#f2f4f7">Apps de escritorio</text>
