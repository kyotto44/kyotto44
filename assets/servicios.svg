  <text x="458" y="208" class="s" font-size="19" font-weight="400" fill="#b9c1cc">Pruebas automáticas incluidas</text>
  <text x="438" y="270" class="s" font-size="16" font-weight="400" fill="#8b949e">Ejemplos: SanRafa, Talento humano</text>
  <rect x="834" y="44" width="44" height="5" rx="2.5" fill="#ff6a3d"/>
  <text x="834" y="98" class="s" font-size="27" font-weight="700" fill="#f2f4f7">Mejorar tu sitio</text>
