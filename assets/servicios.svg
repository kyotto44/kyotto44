  <text x="854" y="208" class="s" font-size="19" font-weight="400" fill="#b9c1cc">Errores y seguridad al día</text>
  <text x="834" y="270" class="s" font-size="16" font-weight="400" fill="#8b949e">Ejemplo: landing-cs, de 2,1 MB a 112 KB</text>
