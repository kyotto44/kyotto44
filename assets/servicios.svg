  <text x="458" y="144" class="s" font-size="19" font-weight="400" fill="#b9c1cc">Java con base de datos</text>
  <rect x="438" y="169" width="7" height="7" rx="1.5" fill="#ff6a3d"/>
  <text x="458" y="176" class="s" font-size="19" font-weight="400" fill="#b9c1cc">Formularios que validan</text>
