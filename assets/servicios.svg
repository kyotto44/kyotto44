<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">Servicios</title>
  <desc id="d">Sitios web y landings. Apps de escritorio en Java con base de datos. Mejorar tu sitio: velocidad, accesibilidad, errores y seguridad. Trabajo de forma remota.</desc>
  <style>
    .s { font-family: "Segoe UI Variable Display","Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif; } .m { font-family: "Cascadia Code","SF Mono",Consolas,"Liberation Mono",monospace; }
    .pulso { transform-box: fill-box; transform-origin: center; animation: pulso 2.2s ease-out infinite; }
    @keyframes pulso { from { transform: scale(1); opacity: 0.7; } to { transform: scale(3); opacity: 0; } }
    
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x="6" y="6" width="1188" height="408" rx="16" fill="#14171c" stroke="#ffffff" stroke-opacity="0.08"/>
