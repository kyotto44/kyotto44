  <text x="854" y="144" class="s" font-size="19" font-weight="400" fill="#b9c1cc">Más rápido y liviano</text>
  <rect x="834" y="169" width="7" height="7" rx="1.5" fill="#ff6a3d"/>
  <text x="854" y="176" class="s" font-size="19" font-weight="400" fill="#b9c1cc">Usable con teclado y lector</text>
