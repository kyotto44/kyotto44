<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="t d">
  <title id="t">Santiago Angarita</title>
  <desc id="d">Estudiante de Ingeniería de Sistemas y Técnico en Sistemas del SENA.</desc>
  <defs>
    <radialGradient id="brillo" cx="88%" cy="100%" r="62%">
      <stop offset="0" stop-color="#d9481c" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#d9481c" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="marco"><rect width="1200" height="380" rx="14"/></clipPath>
  </defs>
  <style>
    .sans { font-family: "Segoe UI Variable Display", "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: "Cascadia Code", "SF Mono", Consolas, "Liberation Mono", monospace; }
    .raya { transform-origin: 72px 0; animation: raya 1s 0.3s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .trazo { stroke-dasharray: 1400; animation: trazo 2.6s 0.2s cubic-bezier(0.65, 0, 0.35, 1) both; }
    .cursor { animation: parpadeo 1.1s steps(1) infinite; }
    @keyframes raya { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes trazo { from { stroke-dashoffset: 1400; } to { stroke-dashoffset: 0; } }
    @keyframes parpadeo { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .raya, .trazo, .cursor { animation: none; } }
  </style>
  <g clip-path="url(#marco)">
    <rect width="1200" height="380" fill="#f6f7f9"/>
    <rect width="1200" height="380" fill="url(#brillo)"/>
    <rect x="0.5" y="0.5" width="1199" height="379" rx="14" fill="none" stroke="#1f2328" stroke-opacity="0.12"/>

    <text x="1160" y="318" text-anchor="end" class="sans trazo" font-size="280" font-weight="800" letter-spacing="-10"
          fill="none" stroke="#d9481c" stroke-opacity="0.6" stroke-width="2.5" textLength="360" lengthAdjust="spacingAndGlyphs">SA</text>

    <text x="72" y="104" class="mono" font-size="20" fill="#b8380f">kyotto44<tspan class="cursor" fill="#d9481c">_</tspan></text>
    <text x="72" y="190" class="sans" font-size="76" font-weight="800" letter-spacing="-2" fill="#14171c"
          textLength="640" lengthAdjust="spacingAndGlyphs">Santiago Angarita</text>
    <rect x="72" y="214" width="120" height="4" rx="2" fill="#d9481c" class="raya"/>
    <text x="72" y="268" class="sans" font-size="28" font-weight="600" fill="#2f363d">Estudiante de Ingeniería de Sistemas</text>
    <text x="72" y="308" class="sans" font-size="24" fill="#57606a">Técnico en Sistemas del SENA</text>
  </g>
</svg>
