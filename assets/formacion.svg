<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="t d">
  <title id="t">Formación</title>
  <desc id="d">Técnico en Sistemas del SENA, completado. Ingeniería de Sistemas en la Universidad Santo Tomás, Tunja, en curso.</desc>
  <style>
    .sans { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: "Cascadia Code", "SF Mono", Consolas, "Liberation Mono", monospace; }
    .linea { stroke-dasharray: 60; animation: linea 0.6s 0.15s ease-out both; }
    @keyframes linea { from { stroke-dashoffset: 60; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .linea { animation: none; } }
  </style>

  <g>
    <rect x="1" y="1" width="560" height="218" rx="14" fill="#111622" stroke="#f3efe4" stroke-opacity="0.08"/>
    <text x="40" y="62" class="mono" font-size="18" fill="#8f9ab0">SENA</text>
    <text x="40" y="118" class="sans" font-size="38" font-weight="700" fill="#f3efe4">Técnico en Sistemas</text>
    <rect x="40" y="148" width="128" height="34" rx="17" fill="#f3efe4" fill-opacity="0.06" stroke="#f3efe4" stroke-opacity="0.14"/>
    <text x="104" y="171" text-anchor="middle" class="sans" font-size="16" font-weight="600" fill="#c3cad6">Completado</text>
  </g>

  <line x1="570" y1="110" x2="630" y2="110" stroke="#2f55f0" stroke-width="3" stroke-linecap="round" class="linea"/>

  <g>
    <rect x="639" y="1" width="560" height="218" rx="14" fill="#151d33" stroke="#2f55f0" stroke-opacity="0.45"/>
    <text x="678" y="62" class="mono" font-size="18" fill="#8fb0ff">Universidad Santo Tomás, Tunja</text>
    <text x="678" y="118" class="sans" font-size="38" font-weight="700" fill="#f3efe4">Ingeniería de Sistemas</text>
    <rect x="678" y="148" width="112" height="34" rx="17" fill="#2f55f0"/>
    <text x="734" y="171" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="#f6f3ea">En curso</text>
  </g>
</svg>
