<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="t d">
  <title id="t">Lo que sé hacer</title>
  <desc id="d">Java y escritorio: JavaFX con FXML y hojas de estilo, Capas: MySQL o datos en memoria, Records, LocalDate y JUnit 5. Bases de datos: MySQL con JDBI, SQLite con JDBC, Consultas con PreparedStatement, Llaves foráneas y transacciones. Desarrollo web: HTML semántico y CSS moderno, JavaScript sin frameworks, Tailwind y Bootstrap a medida. Accesibilidad: Contraste WCAG AA revisado, Todo se usa con el teclado, ARIA y movimiento reducido. Rendimiento: Imágenes WebP con srcset, PitLane: de 7,1 MB a 0,8 MB, Dependencias sin uso, fuera. Seguridad: Cabeceras CSP y HTTPS, Contraseñas fuera del código, Sin datos reales en los repos.</desc>
  <style>
    .s { font-family: "Segoe UI Variable Display","Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif; } .m { font-family: "Cascadia Code","SF Mono",Consolas,"Liberation Mono",monospace; }
    .pulso { transform-box: fill-box; transform-origin: center; animation: pulso 2.2s ease-out infinite; }
    @keyframes pulso { from { transform: scale(1); opacity: 0.7; } to { transform: scale(3); opacity: 0; } }
    
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
